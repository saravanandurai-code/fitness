name: Build Sarv

# GitHub Pages serves this repository with "Deploy from a branch" → /docs, so
# the deployment is simply the committed contents of docs/. This workflow keeps
# that folder in sync with the source on every push.
on:
  push:
    branches:
      - claude/sarv-lifestyle-app-mvp-4v97bd
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The Fitraa web demo is published alongside Sarv, so its deps are needed
      # here to run the export.
      - run: npm --prefix fitraa ci

      - run: npm run lint
      - run: npm test
      # Builds Sarv into docs/, then stages the Fitraa web export at
      # docs/fitraa with the not-found fallbacks.
      - run: npm run build:site

      # "[skip ci]" plus the paths-ignore above keeps this from re-triggering
      # itself; an unchanged build produces no commit at all.
      - name: Commit the rebuilt site
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs/ from ${GITHUB_SHA::7} [skip ci]"
          git push

  # The Fitraa mobile app lives in fitraa/ and is checked independently of the
  # Sarv web build above.
  fitraa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitraa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fitraa/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Publishes docs/ when the repository's Pages source is "GitHub Actions".
  #
  # If the source is instead "Deploy from a branch" (branch + /docs), GitHub's
  # own builder publishes the committed docs/ folder and this job is redundant:
  # configure-pages then reports that the site is not in workflow mode, so the
  # job soft-fails rather than failing the run.
  publish:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build job may have just committed a rebuilt docs/.
          ref: ${{ github.ref }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
