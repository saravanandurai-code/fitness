name: Build Sarv

# GitHub Pages serves this repository with "Deploy from a branch" → /docs, so
# the deployment is simply the committed contents of docs/. This workflow keeps
# that folder in sync with the source on every push.
on:
  push:
    branches:
      - claude/sarv-lifestyle-app-mvp-4v97bd
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build

      # "[skip ci]" plus the paths-ignore above keeps this from re-triggering
      # itself; an unchanged build produces no commit at all.
      - name: Commit the rebuilt site
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs/ from ${GITHUB_SHA::7} [skip ci]"
          git push
